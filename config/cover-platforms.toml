# 封面平台登记 —— 由封面模块（tools/covers.py）使用，与 Logo 资产（config/logo-targets.toml）无关。
#
# [ratios]  画幅：同一画幅的平台共用一份设计稿，画布尺寸即起稿尺寸；
# [[platform]] 平台：导出时从所属画幅的画布“铺满后居中裁切”到平台尺寸；
#              safe / occlusions 为平台尺寸下的 [x, y, 宽, 高]（安全区 / 头像等遮挡区）。
# 规格依据：basis = official（须有官方 source）/ common（业内通用，须写 verify_note）/ generic（泛用比例）；
#           超过 12 个月未复核会提醒。

[ratios]
"16x9" = { width = 2560, height = 1440, label = "横幅 16:9" }
"3x1" = { width = 1500, height = 500, label = "横幅 3:1" }
"2.7x1" = { width = 1640, height = 624, label = "横幅约 2.6:1" }
"6x1" = { width = 1920, height = 320, label = "窄横幅 6:1" }
"1.91x1" = { width = 1200, height = 630, label = "分享图 1.91:1" }
"4x3" = { width = 1600, height = 1200, label = "横版 4:3" }
"3x4" = { width = 1200, height = 1600, label = "竖版 3:4" }
"9x16" = { width = 1080, height = 1920, label = "竖屏 9:16" }
"1x1" = { width = 1080, height = 1080, label = "方形 1:1" }

[[platform]]
id = "youtube"
name = "YouTube 频道横幅"
ratio = "16x9"
width = 2560
height = 1440
safe = [507, 509, 1546, 423]  # 官方：最小尺寸 2048x1152 时文字/Logo 安全区 1235x338，按 2560 等比放大
verified_on = "2026-10-13"
source = "https://support.google.com/youtube/answer/10456525"

[[platform]]
id = "x"
name = "X 个人主页头图"
