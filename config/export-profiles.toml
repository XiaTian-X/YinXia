[general]
layout = ""
sizes = [64, 128, 256, 512, 1024]
# modes = ["color", "mono", "reversed"] # 默认取项目自身的 color_modes

[favicon]
layout = "icon"
sizes = [16, 32, 48]
ico_sizes = [16, 32, 48]
apple_touch_layout = "icon"
apple_touch_size = 180

[ios]
layout = "app-icon"
sizes = [1024]
opaque = true
verified_on = "2026-10-09"
source = "https://developer.apple.com/design/human-interface-guidelines/app-icons"

[android]
legacy_layout = "app-icon"
play_store_size = 512
adaptive_foreground_layout = "icon"
adaptive_size = 432
adaptive_safe_ratio = 0.5
verified_on = "2026-10-09"
source = "https://developer.android.com/develop/ui/views/launch/icon_design_adaptive"
[android.mipmap]
mdpi = 48
hdpi = 72
xhdpi = 96
xxhdpi = 144
xxxhdpi = 192

[social]
# 尚未登记具体尺寸的平台；补齐（尺寸 + 安全区 + 官方来源 + 核对日期）后从此列表移除
pending = ["微信公众号封面（约 2.35:1）", "微博封面", "哔哩哔哩空间头图", "视频号封面", "快手封面", "知乎封面"]
[social.avatar]
layout = "avatar"
sizes = [400, 800, 1080]
safe_radius_ratio = 0.8
verified_on = "2026-10-09"
source = "" # 各平台头像均为方图圆裁，暂无单一官方出处，待补

[[social.cover]]
