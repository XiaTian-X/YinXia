# [state] 只能通过 ./logo state / version / release / export 修改；其余配置（色板、版式、导出）可手工维护
[project]
name = "{{name}}"
slug = "{{slug}}"
client = "Myself"
created = "{{date}}"

[state]
stage = "briefing"
selected_direction = ""
selected_version = ""
current_release = ""
updated = "{{date}}"

[palette]
primary = "#000000"
secondary = "#666666"
ink = "#111111"

[color_modes]
modes = ["color", "mono", "reversed"]
[color_modes.mono]
primary = "#000000"
secondary = "#000000"
ink = "#000000"
[color_modes.reversed]
primary = "#FFFFFF"
secondary = "#FFFFFF"
ink = "#FFFFFF"

[fonts]
used = []

[layouts]
# 含中英文字标的项目保留 wordmark-cn / wordmark-en；纯图形项目删去即可
logo = ["primary", "horizontal", "icon", "wordmark-cn", "wordmark-en"]

[export]
profiles = ["general", "favicon", "ios", "android", "social"]
android_background = "primary"
android_foreground_mode = "reversed"
